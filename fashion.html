<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ميجا جرافيك | تصميم مواقع الموضة والملابس</title>
    
    <!-- الخطوط والأيقونات -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-dark: #0D0D11;
            --bg-card: #15151D;
            --rose-gold: #E8B4B8;
            --rose-gold-glow: #F3D1D4;
            --rose-accent: #C08086;
            --text-light: #F7F7F9;
            --text-muted: #A0A0B0;
            --border-rose: rgba(232, 180, 184, 0.25);
            --whatsapp-color: #25D366;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            line-height: 1.7;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(232, 180, 184, 0.06) 0%, transparent 40%),
                radial-gradient(circle at 85% 85%, rgba(192, 128, 134, 0.05) 0%, transparent 40%);
        }

        /* الهيدر وقائمة التنقل */
        header {
            background: rgba(13, 13, 17, 0.9);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid var(--border-rose);
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1200px;
            margin: 0 auto;
            padding: 1rem 2rem;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }

        .header-logo {
            height: 50px;
            width: auto;
            object-fit: contain;
            filter: drop-shadow(0 0 8px rgba(232, 180, 184, 0.3));
        }

        .logo-text {
            font-size: 1.8rem;
            font-weight: 900;
            color: #FFFFFF;
        }

        .logo-text span {
            color: var(--rose-gold);
            text-shadow: 0 0 10px rgba(232, 180, 184, 0.4);
        }

        .back-btn {
            text-decoration: none;
            color: var(--rose-gold-glow);
            font-weight: 700;
            padding: 0.5rem 1.4rem;
            border-radius: 20px;
            border: 1px solid var(--rose-gold);
            background: rgba(232, 180, 184, 0.05);
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .back-btn:hover {
            color: #000;
            background: var(--rose-gold);
            box-shadow: 0 0 18px rgba(232, 180, 184, 0.5);
        }

        /* بنر الصفحة */
        .hero-banner {
            text-align: center;
            padding: 5rem 2rem 4rem;
            background: radial-gradient(circle at center, #1E1B24 0%, var(--bg-dark) 100%);
            border-bottom: 1px solid var(--border-rose);
        }

        .hero-banner h1 {
            font-size: 2.7rem;
            color: var(--rose-gold-glow);
            margin-bottom: 1rem;
            font-weight: 900;
            text-shadow: 0 0 15px rgba(232, 180, 184, 0.3);
        }

        .hero-banner p {
            font-size: 1.2rem;
            color: var(--text-muted);
            max-width: 750px;
            margin: 0 auto;
        }

        /* معرض الصور الشبكي */
        .gallery-section {
            max-width: 1200px;
            margin: 4rem auto;
            padding: 0 2rem;
        }

        .section-title {
            text-align: center;
            margin-bottom: 3rem;
        }

        .section-title h2 {
            font-size: 2.2rem;
            color: var(--rose-gold);
            position: relative;
            display: inline-block;
            font-weight: 800;
        }

        .section-title h2::after {
            content: '';
            width: 60%;
            height: 3px;
            background: linear-gradient(90deg, transparent, var(--rose-gold), transparent);
            position: absolute;
            bottom: -10px;
            right: 20%;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
            gap: 1.8rem;
        }

        .gallery-card {
            background: var(--bg-card);
            border: 1px solid var(--border-rose);
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(0,0,0,0.6);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            cursor: pointer;
        }

        .gallery-card:hover {
            transform: translateY(-8px);
            border-color: var(--rose-gold);
            box-shadow: 0 12px 30px rgba(232, 180, 184, 0.25);
        }

        .gallery-img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            display: block;
            background: #111;
            transition: transform 0.4s ease;
        }

        .gallery-card:hover .gallery-img {
            transform: scale(1.06);
        }

        .gallery-info {
            padding: 1rem;
            text-align: center;
            background: rgba(21, 21, 29, 0.95);
        }

        .gallery-info h4 {
            color: var(--rose-gold-glow);
            font-size: 1.1rem;
            font-weight: 700;
        }

        /* نافذة المعاينة بالكامل (Fullscreen Lightbox Modal) */
        .lightbox-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(5, 5, 8, 0.92);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10000;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
            padding: 20px;
        }

        .lightbox-modal.active {
            opacity: 1;
            visibility: visible;
        }

        .lightbox-content {
            max-width: 90%;
            max-height: 90vh;
            object-fit: contain;
            border-radius: 12px;
            border: 2px solid var(--rose-gold);
            box-shadow: 0 0 35px rgba(232, 180, 184, 0.4);
            transform: scale(0.85);
            transition: transform 0.3s ease;
        }

        .lightbox-modal.active .lightbox-content {
            transform: scale(1);
        }

        .lightbox-close {
            position: absolute;
            top: 20px;
            left: 25px;
            color: var(--rose-gold);
            font-size: 2.5rem;
            cursor: pointer;
            transition: color 0.3s;
        }

        .lightbox-close:hover {
            color: #FFFFFF;
        }

        /* الأزرار العائمة جهة اليسار (اتصال وواتساب) */
        .floating-buttons {
            position: fixed;
            bottom: 25px;
            left: 25px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            z-index: 9999;
        }

        /* زر الرجوع العائم جهة اليمين */
        .floating-back-btn {
            position: fixed;
            bottom: 25px;
            right: 25px;
            width: 58px;
            height: 58px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--rose-gold) 0%, var(--rose-accent) 100%);
            color: #000000;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.7rem;
            text-decoration: none;
            box-shadow: 0 5px 20px rgba(232, 180, 184, 0.4);
            z-index: 9999;
            transition: all 0.3s ease;
        }

        .floating-back-btn:hover {
            transform: scale(1.12);
            box-shadow: 0 8px 25px rgba(232, 180, 184, 0.7);
        }

        .floating-btn {
            width: 58px;
            height: 58px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            color: #FFFFFF;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .floating-whatsapp {
            background-color: var(--whatsapp-color);
            box-shadow: 0 5px 20px rgba(37, 211, 102, 0.4);
        }

        .floating-call {
            background: linear-gradient(135deg, var(--rose-gold) 0%, var(--rose-accent) 100%);
            color: #000000;
            box-shadow: 0 5px 20px rgba(232, 180, 184, 0.4);
        }

        .floating-btn:hover {
            transform: scale(1.12);
        }

        /* الفوتر */
        footer {
            background-color: #08080C;
            color: var(--text-muted);
            text-align: center;
            padding: 2rem;
            margin-top: 5rem;
            border-top: 1px solid var(--border-rose);
        }

        footer strong {
            color: var(--rose-gold);
        }

        @media (max-width: 768px) {
            .navbar { flex-direction: column; gap: 1rem; }
            .hero-banner h1 { font-size: 1.9rem; }
            .gallery-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
            .gallery-img { height: 150px; }
            .floating-buttons { bottom: 18px; left: 18px; gap: 10px; }
            .floating-back-btn { bottom: 18px; right: 18px; width: 50px; height: 50px; font-size: 1.5rem; }
            .floating-btn { width: 50px; height: 50px; font-size: 1.5rem; }
        }
    </style>
</head>
<body>

    <!-- الهيدر -->
    <header>
        <nav class="navbar">
            <a href="index.html" class="logo-container">
                <img src="100.png" alt="شعار ميجا جرافيك" class="header-logo">
                <span class="logo-text">ميجا <span>جرافيك</span></span>
            </a>
            <a href="index.html" class="back-btn"><i class="fa-solid fa-arrow-right"></i> العودة للرئيسية</a>
        </nav>
    </header>

    <!-- البنر الرئيسي -->
    <section class="hero-banner">
        <h1><i class="fa-solid fa-shirt"></i> تصميم مواقع الموضة والأزياء</h1>
        <p>نُصمم متاجر وواجهات رقمية ساحرة تعرض المنتجات، المقاسات، والألوان بأناقة تجذب العملاء وتمنحهم تجربة تسوق راقية وفريدة.</p>
    </section>

    <!-- معرض الصور الديناميكي من 51.png إلى 60.png -->
    <section class="gallery-section">
        <div class="section-title">
            <h2>معرض أعمالنا ونماذج متاجر الأزياء</h2>
        </div>

        <div class="gallery-grid" id="galleryContainer">
            <!-- سيتم إنشاء أظرف الصور تلقائياً بواسطة JavaScript -->
        </div>
    </section>

    <!-- نافذة المعاينة الكبيرة للصورة بالكامل -->
    <div class="lightbox-modal" id="lightboxModal">
        <span class="lightbox-close" id="lightboxClose">&times;</span>
        <img src="" alt="معاينة التصميم" class="lightbox-content" id="lightboxImg">
    </div>

    <!-- زر عائم جهة اليمين للرجوع للرئيسية index.html -->
    <a href="index.html" class="floating-back-btn" title="الرجوع للصفحة الرئيسية">
        <i class="fa-solid fa-house"></i>
    </a>

    <!-- الأزرار العائمة جهة اليسار -->
    <div class="floating-buttons">
        <a href="tel:01010255123" class="floating-btn floating-call" title="إتصال هاتفي مباشر">
            <i class="fa-solid fa-phone"></i>
        </a>
        <a href="https://wa.me/201010255123?text=مرحباً%20ميجا%20جرافيك،%20أرغب%20في%20استفسار%20عن%20تصميم%20متجر%20ملابس" target="_blank" class="floating-btn floating-whatsapp" title="تواصل عبر الواتساب">
            <i class="fa-brands fa-whatsapp"></i>
        </a>
    </div>

    <!-- الفوتر -->
    <footer>
        <p>جميع الحقوق محفوظة &copy; 2026 لموقع <strong>ميجا جرافيك</strong></p>
    </footer>

    <!-- السكربت لتوليد الصور من 51 إلى 60 والتحكم بالمعاينة الكبيرة -->
    <script>
        const galleryContainer = document.getElementById('galleryContainer');
        const lightboxModal = document.getElementById('lightboxModal');
        const lightboxImg = document.getElementById('lightboxImg');
        const lightboxClose = document.getElementById('lightboxClose');

        // إنشاء عناصر الصور من 51 إلى 60 تلقائياً
        for (let i = 51; i <= 60; i++) {
            const card = document.createElement('div');
            card.className = 'gallery-card';
            const imageSrc = `${i}.png`;

            card.innerHTML = `
                <img src="${imageSrc}" alt="تصميم ${i}" class="gallery-img" onerror="this.onerror=null; this.src='100.png';">
                <div class="gallery-info">
                    <h4>نموذج أزياء رقم ${i}</h4>
                </div>
            `;

            // عند النقر على الكارت يفتح الصورة بحجم كامل
            card.addEventListener('click', () => {
                lightboxImg.src = imageSrc;
                lightboxModal.classList.add('active');
            });

            galleryContainer.appendChild(card);
        }

        // إغلاق النافذة عند النقر على زر X
        lightboxClose.addEventListener('click', () => {
            lightboxModal.classList.remove('active');
        });

        // إغلاق النافذة عند النقر في أي مكان خارج الصورة
        lightboxModal.addEventListener('click', (e) => {
            if (e.target !== lightboxImg) {
                lightboxModal.classList.remove('active');
            }
        });
    </script>
</body>
</html>
